# render.yaml
# Configuración para despliegue automático en Render.com
# Compatible con tu main.py (Flask + PostgreSQL)

services:
  - type: web
    name: CronoAndes-Nata
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT main:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: cronoandes-nata-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: cronoandes-nata-db
    databaseName: cronoandes_nata_db
    user: cronoandes_user
    region: oregon
    plan: free
