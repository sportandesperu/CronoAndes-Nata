# render.yaml
# Configuración para despliegue automático en Render.com

services:
  - type: web
    name: CronoAndes-Nata
    runtime: python
    region: oregon # o frankfurt, según tu ubicación preferida
    plan: free # o cambiar a 'starter' si necesitas más recursos
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Render lo inyectará desde el servicio de base de datos
    healthCheckPath: /health

databases:
  - name: cronoandes-nata-db
    databaseName: cronoandes_nata_db
    user: cronoandes_user
    region: oregon
    plan: free # Cambia a 'starter' en producción si esperas mucho tráfico
